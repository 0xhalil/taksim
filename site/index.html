<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>taksim</title>
<meta name="description" content="A live canvas for the agent CLIs you already pay for: Claude Code, Codex, Gemini, Copilot and opencode work side by side, build their own tools and talk to each other.">
<meta name="theme-color" content="#1E1F22">
<meta property="og:title" content="taksim">
<meta property="og:description" content="A live canvas for the agent CLIs you already pay for. No API key.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1000 1000%22 style=%22color:%233574F0%22%3E%3Cmask id=%22m%22%3E%3Cpath d=%22M500 100 L630 230 V370 H770 L900 500 L770 630 H630 V770 L500 900 L370 770 V630 H230 L100 500 L230 370 H370 V230 Z%22 fill=%22%23fff%22/%3E%3Cg fill=%22none%22 stroke=%22%23000%22 stroke-width=%2234%22%3E%3Cg transform=%22rotate%280 500 500%29%22%3E%3Cpath d=%22M500 40 V330 A170 170 0 0 1 330 500 H40%22/%3E%3Cpath d=%22M500 40 V330%22/%3E%3C/g%3E%3Cg transform=%22rotate%2890 500 500%29%22%3E%3Cpath d=%22M500 40 V330 A170 170 0 0 1 330 500 H40%22/%3E%3Cpath d=%22M500 40 V330%22/%3E%3C/g%3E%3Cg transform=%22rotate%28180 500 500%29%22%3E%3Cpath d=%22M500 40 V330 A170 170 0 0 1 330 500 H40%22/%3E%3Cpath d=%22M500 40 V330%22/%3E%3C/g%3E%3Cg transform=%22rotate%28270 500 500%29%22%3E%3Cpath d=%22M500 40 V330 A170 170 0 0 1 330 500 H40%22/%3E%3Cpath d=%22M500 40 V330%22/%3E%3C/g%3E%3C/g%3E%3C/mask%3E%3Crect width=%221000%22 height=%221000%22 fill=%22currentColor%22 mask=%22url%28%23m%29%22/%3E%3C/svg%3E">
<style>html, body { margin: 0; } body { font-size: 14px; -webkit-font-smoothing: antialiased; } [hidden] { display: none !important; }</style>
<style>
/* Layout: one full-height canvas that plays a session by itself. The camera follows the story:
   orchestrator in front -> a job typed in -> its team is born -> they talk -> the IDE docks. Nodes are drawn to the native app's own measurements. */
:root {
  --bg: #1E1F22; --panel: #2B2D30; --panel2: #393B40; --line: #43454A; --ink: #DFE1E5; --text: #BCBEC4;
  --muted: #868A91; --muted1: #9DA0A8; --muted2: #6F737A; --accent: #3574F0; --accent-ink: #FFFFFF; --sel: #2E436E;
  --ok: #5FB865; --err: #F75464; --warn: #F2C55C; --wait: #2AACB8; --grid: #35373B; --node-head: #323438; --node-body: #2B2D30;
  --tint: rgba(255, 255, 255, .13); --tint-lo: rgba(255, 255, 255, .06); --msg: #6B6862; --shadow: rgba(0, 0, 0, .12);
  --kw: #CF8E6D; --str: #6AAB73; --com: #7A7E85; --fn: #56A8F5; --line-hl: #26282E;
  --b-claude: #D97757; --b-codex: #3941FF; --b-opencode: #000000; --b-gemini: #207CFE; --b-copilot: #000000; --group: #548AF7; --on-brand: #FFFFFF;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --title: Arial, "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.3, 1.35, .5, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #FFFFFF; --panel: #F7F8FA; --panel2: #EBECF0; --line: #DFE1E5; --ink: #1E1F22; --text: #2B2D30;
    --muted: #6C707E; --muted1: #5A5D6B; --muted2: #A8ADBD; --sel: #D4E2FF; --ok: #208A3C; --err: #DB3B4B; --warn: #B27A00; --wait: #0B8A96;
    --grid: #DFE1E5; --node-head: #F2F3F5; --node-body: #FFFFFF; --tint: rgba(0, 0, 0, .09); --tint-lo: rgba(0, 0, 0, .05);
    --kw: #0033B3; --str: #067D17; --com: #8C8C8C; --fn: #00627A; --line-hl: #F5F8FE;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #FFFFFF; --panel: #F7F8FA; --panel2: #EBECF0; --line: #DFE1E5; --ink: #1E1F22; --text: #2B2D30;
  --muted: #6C707E; --muted1: #5A5D6B; --muted2: #A8ADBD; --sel: #D4E2FF; --ok: #208A3C; --err: #DB3B4B; --warn: #B27A00; --wait: #0B8A96;
  --grid: #DFE1E5; --node-head: #F2F3F5; --node-body: #FFFFFF; --tint: rgba(0, 0, 0, .09); --tint-lo: rgba(0, 0, 0, .05);
  --kw: #0033B3; --str: #067D17; --com: #8C8C8C; --fn: #00627A; --line-hl: #F5F8FE;
  color-scheme: light;
}

body { background: var(--bg); color: var(--ink); font-family: var(--ui); }
* { box-sizing: border-box; }
svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#stage { position: relative; height: 100svh; min-height: 520px; overflow: hidden; background: var(--bg); }
#grid { position: absolute; inset: 0; background-image: radial-gradient(circle, var(--grid) 1.1px, transparent 1.4px); background-size: 40px 40px; }

#stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 200px; z-index: 4; pointer-events: none; background: linear-gradient(transparent, var(--bg) 62%); }
.mark { position: absolute; left: 16px; top: 16px; z-index: 5; font: 700 16px/1 var(--ui); letter-spacing: -.01em; display: flex; align-items: center; gap: 7px; }
.mark svg { width: 22px; height: 22px; color: var(--accent); display: block; }
.top { position: absolute; right: 16px; top: 10px; z-index: 6; display: flex; align-items: center; gap: 6px; }
#lang { height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font: 500 13px/1 var(--ui); cursor: pointer; }
#lang:hover { background: var(--tint-lo); }
#lang:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
#gh { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--ink); text-decoration: none; }
#gh:hover { background: var(--tint-lo); }
#gh svg { width: 18px; height: 18px; }
#gh:focus-visible, footer a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
#cta {
  border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; text-decoration: none;
  background: var(--accent); color: var(--accent-ink); font: 600 13.5px/1 var(--ui); display: flex; align-items: center; gap: 7px;
}
#cta.glow { animation: glow 1.6s ease-out 2; }
@keyframes glow { 0% { box-shadow: 0 0 0 0 var(--accent); } 100% { box-shadow: 0 0 0 16px transparent; } }
#cta:focus-visible, #replay:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.say { position: absolute; left: 16px; right: 64px; bottom: 44px; z-index: 5; }
#cap { margin: 0; font: 650 clamp(24px, 4.4vw, 44px)/1.08 var(--ui); letter-spacing: -.025em; text-wrap: balance; }
#bar { position: absolute; left: 16px; bottom: 22px; z-index: 5; display: flex; gap: 6px; }
#bar i { width: 20px; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
#bar i.on { background: var(--accent); }
#replay {
  position: absolute; right: 16px; bottom: 16px; z-index: 5; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); display: grid; place-items: center;
}

#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform .95s var(--ease); will-change: transform; }
#edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.pill {
  position: absolute; height: 18px; padding: 0 7px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line);
  font: 500 11px/16px var(--ui); color: var(--text); white-space: nowrap; transform: translate(-50%, -50%); opacity: 0; transition: opacity .25s;
}
.pill.on { opacity: 1; }
.pill.soft { font-weight: 400; color: var(--muted); }

/* ---- the agent node (GraphDraw.drawNode) ---- */
.node {
  position: absolute; border-radius: 8px; background: var(--node-body); box-shadow: 0 1px 3px var(--shadow);
  opacity: 0; transition: transform .55s var(--spring), opacity .22s; cursor: grab; user-select: none;
}
.node.on { opacity: 1; transform: none !important; }
.node.lift { box-shadow: 0 5px 12px rgba(0, 0, 0, .22); cursor: grabbing; z-index: 4; }
.ring { position: absolute; inset: -4px; border-radius: 11px; border: 2px solid transparent; pointer-events: none; }
.node[data-status="running"] .ring { border-color: var(--ok); animation: pulse 1.4s linear infinite; }
.node[data-status="waiting"] .ring { border-color: var(--wait); animation: pulse 1.4s linear infinite; }
@keyframes pulse { 0%, 50%, 100% { opacity: .45; } 25%, 75% { opacity: .9; } }

.tbar { position: relative; height: 30px; background: var(--node-head); border-radius: 8px 8px 0 0; border-bottom: 1px solid var(--grid); }
.logo { position: absolute; left: 6px; top: 5px; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: var(--on-brand); }
.logo svg { width: 14px; height: 14px; fill: currentColor; }
.logo svg.i { fill: none; }
.logo.icon { overflow: hidden; }
.logo.icon svg { width: 20px; height: 20px; }
.nm { position: absolute; left: 30px; top: 0; font: 400 14px/30px var(--title); color: var(--ink); white-space: nowrap; }
.why { font: 400 11.5px/30px var(--ui); color: var(--muted); margin-left: 8px; opacity: 0; transition: opacity .3s; }
.why.on { opacity: 1; }
.tb { position: absolute; top: 6px; width: 22px; height: 18px; border-radius: 5px; background: var(--tint-lo); display: grid; place-items: center; color: var(--ink); transition: background .25s, color .25s; }
.tb.term { right: 6px; background: var(--tint); } .tb.code { right: 32px; } .tb.help { right: 58px; } .tb.wand { right: 84px; color: var(--muted1); }
.tb.lit { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.tb.flash { background: var(--accent); color: var(--accent-ink); }
.sdot { position: absolute; right: 87px; top: 11px; width: 8px; height: 8px; border-radius: 50%; display: none; }
.node[data-status="running"] .sdot { display: block; background: var(--ok); animation: pulse 1.4s linear infinite; }
.node[data-status="waiting"] .sdot { display: block; background: var(--wait); }

.acct { margin-left: 12px; font: 400 11.5px/30px var(--ui); color: var(--muted1); display: inline-flex; align-items: center; gap: 4px; vertical-align: top; height: 30px; }
.acct svg { width: 12px; height: 12px; }
.acct { transition: color .3s; }
.acct b { font-weight: 400; }
.acct.hi { color: var(--ink); }
.rail { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 8px 0 0 8px; background: var(--group); z-index: 1; transform: scaleY(0); transition: transform .4s var(--ease); }
.node.grouped .rail { transform: none; }

/* ---- a group: a quiet frame, its name, its shared note (GraphDraw.drawGroups) ---- */
.grp { position: absolute; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--group) 28%, transparent); background: color-mix(in srgb, var(--group) 5.5%, transparent);
  opacity: 0; transform: scale(1.12); transition: transform .6s var(--spring), opacity .3s; pointer-events: none; font: 500 12px/1 var(--ui); color: var(--ink); }
.grp.on { opacity: 1; transform: none; }
.grp i { position: absolute; left: 11px; top: 11px; width: 5px; height: 5px; border-radius: 50%; background: var(--group); }
.grp span { position: absolute; left: 23px; top: 8px; }
.grp em { position: absolute; right: 10px; top: 6px; display: flex; align-items: center; gap: 4px; font: 500 10.5px/1 var(--ui); font-style: normal; color: var(--muted); transition: color .3s; }
.grp em.has { color: var(--group); }
.grp q { quotes: none; font: 500 11.5px/1 var(--ui); animation: rise .35s var(--ease); }
.grp em.has svg { fill: color-mix(in srgb, var(--group) 35%, transparent); }
.spark { position: absolute; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--group); box-shadow: 0 0 12px var(--group); transition: left .7s var(--ease), top .7s var(--ease), opacity .2s; z-index: 6; }

.tb.help.lit svg { fill: currentColor; }
.tools .orc { display: none; }
.node.orch .tools .orc { display: flex; }
.node.orch .tools .orc svg { color: var(--accent); }
#cur { position: absolute; width: 20px; height: 20px; z-index: 8; opacity: 0; pointer-events: none; transition: left .8s var(--ease), top .8s var(--ease), opacity .25s; }
#cur.on { opacity: 1; }
#cur svg { width: 20px; height: 20px; fill: var(--ink); stroke: var(--bg); stroke-width: 1.2; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .45)); }
#cur::after { content: ""; position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; }
#cur.click::after { animation: ripple .45s ease-out; }
@keyframes ripple { from { opacity: 1; transform: scale(.3); } to { opacity: 0; transform: scale(1.8); } }

/* ---- the chat in the node ---- */
.chat { position: absolute; left: 4px; top: 32px; right: 10px; bottom: 10px; background: var(--bg); overflow: hidden; }
.chead { height: 34px; padding: 0 12px; display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 11px; }
.chead b { font-weight: 600; color: var(--ink); margin-right: auto; }
.msgs { position: absolute; left: 0; right: 0; top: 34px; bottom: 102px; padding: 2px 12px 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; font-size: 12.5px; line-height: 1.4; }
.msgs > * { animation: rise .3s var(--ease); flex: none; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.empty { margin: auto; text-align: center; color: var(--ink); font: 500 14px/1 var(--ui); display: grid; gap: 12px; }
.empty span { display: flex; gap: 14px; justify-content: center; color: var(--muted); font: 400 11px/19px var(--ui); }
.empty kbd { display: inline-block; width: 19px; height: 19px; border-radius: 4px; background: var(--panel2); font: 400 11px/19px var(--mono); margin-right: 6px; }
.user { background: color-mix(in srgb, var(--panel) 55%, transparent); border-radius: 8px; padding: 8px 10px; color: var(--ink); }
.ai { color: var(--ink); }
.act { display: flex; align-items: center; gap: 7px; font: 400 11px/1.3 var(--mono); color: var(--muted); }
.act svg { width: 12px; height: 12px; }
.chip { position: absolute; z-index: 6; transform: translate(-50%, -50%); padding: 4px 9px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 600 11px/1 var(--ui); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); transition: left .6s var(--ease), top .6s var(--ease); pointer-events: none; }
.work { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11.5px; }
.work i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
.work i:nth-child(2) { animation-delay: .2s; } .work i:nth-child(3) { animation-delay: .4s; }
.work i + i { margin-left: -4px; }
@keyframes blink { 0%, 100% { opacity: .3; } 40% { opacity: 1; } }
.changes { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font: 400 11px/1 var(--mono); }
.changes div { display: flex; gap: 8px; align-items: center; height: 24px; padding: 0 10px; }
.changes div:first-child { border-bottom: 1px solid var(--line); height: 28px; }
.changes b { font: 600 11.5px/1 var(--ui); color: var(--ink); margin-right: auto; }
.changes span { font: 400 12px/1 var(--ui); color: var(--ink); margin-right: auto; }
.changes em { font-style: normal; color: var(--ok); } .changes s { text-decoration: none; color: var(--err); }

.comp { position: absolute; left: 10px; right: 10px; bottom: 9px; height: 86px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--line) 70%, transparent); background: color-mix(in srgb, var(--panel) 45%, var(--bg)); }
.model { position: absolute; left: 12px; top: 9px; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink); }
.field { position: absolute; left: 14px; right: 14px; top: 12px; font-size: 13px; line-height: 1.35; color: var(--ink); max-height: 36px; overflow: hidden; }
.field:empty::before { content: attr(data-ph); color: var(--muted2); }
.field.typing::after { content: ""; display: inline-block; width: 1.5px; height: 14px; background: var(--accent); vertical-align: -2px; margin-left: 1px; animation: blink 1s steps(2) infinite; }
.tools { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 14px; font-size: 11.5px; color: var(--ink); }
.tools span { display: flex; align-items: center; gap: 5px; }
.tools svg { color: var(--muted); }
.tools svg.v { width: 9px; height: 9px; margin-left: -2px; }
.clip { position: absolute; right: 44px; bottom: 14px; color: var(--muted); }
.go { position: absolute; right: 9px; bottom: 9px; width: 26px; height: 26px; border-radius: 7px; background: var(--sel); color: var(--accent-ink); display: grid; place-items: center; transition: background .2s, transform .2s var(--spring); }
.go.ready { background: var(--accent); }
.go.press { transform: scale(.82); }
.go .stop { display: none; width: 9px; height: 9px; border-radius: 2px; background: currentColor; }
.node[data-status="running"] .go, .node[data-status="waiting"] .go { background: var(--err); }
.node[data-status="running"] .go svg, .node[data-status="waiting"] .go svg { display: none; }
.node[data-status="running"] .go .stop, .node[data-status="waiting"] .go .stop { display: block; }
.node[data-status="running"] .tools, .node[data-status="waiting"] .tools { color: var(--muted); }

/* ---- the docked IDE (IDEDock + IDEView) ---- */
#ide { position: absolute; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; opacity: 0; transform: scaleX(.05); transform-origin: 0 50%; transition: transform .6s var(--spring), opacity .25s; }
#ide.on { opacity: 1; transform: none; }
.ihead { height: 30px; background: var(--node-head); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; font: 600 12px/1 var(--ui); color: var(--ink); }
.ihead > svg { color: var(--accent); width: 13px; height: 13px; stroke-width: 1.8; }
.ihead span { margin-left: auto; display: flex; gap: 10px; color: var(--muted); }
.ibody { position: absolute; inset: 30px 0 0 0; display: flex; border-top: 1px solid var(--line); }
.strip { width: 34px; flex: none; padding: 6px 3px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); color: var(--muted); }
.strip div { position: relative; width: 28px; height: 26px; border-radius: 6px; display: grid; place-items: center; }
.strip .lit { background: var(--sel); color: var(--accent); }
.strip u { position: absolute; right: -2px; top: -2px; min-width: 12px; height: 12px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font: 700 8px/12px var(--ui); text-align: center; text-decoration: none; opacity: 0; transition: opacity .3s; }
.strip u.on { opacity: 1; }
.tree { width: 32%; max-width: 230px; flex: none; border-right: 1px solid var(--line); font-size: 12px; color: var(--text); overflow: hidden; }
.tree .root { height: 32px; padding: 0 10px; display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); }
.tree .root svg { color: var(--accent); fill: currentColor; width: 12px; height: 12px; }
.tree p { margin: 0 4px; height: 22px; border-radius: 4px; display: flex; align-items: center; gap: 5px; white-space: nowrap; padding-right: 4px; }
.tree p svg { width: 11px; height: 11px; color: var(--muted); }
.tree p.d0 { padding-left: 4px; } .tree p.d1 { padding-left: 18px; } .tree p.d2 { padding-left: 32px; }
.tree p.sel { background: var(--sel); }
.tree .m { color: var(--accent); } .tree .a { color: var(--ok); }
.tree p.new { max-height: 0; opacity: 0; overflow: hidden; transition: max-height .35s var(--ease), opacity .3s; }
.tree p.new.on { max-height: 22px; opacity: 1; }
.edit { flex: 1; min-width: 0; background: var(--bg); display: flex; flex-direction: column; }
.tabs { height: 30px; flex: none; border-bottom: 1px solid var(--line); display: flex; font-size: 12px; }
.tabs div { padding: 0 12px; display: flex; align-items: center; gap: 6px; color: var(--ink); border-bottom: 2px solid var(--accent); white-space: nowrap; }
.tabs svg { width: 11px; height: 11px; color: var(--fn); }
.src { padding: 6px 0; font: 400 12px/20px var(--mono); color: var(--text); white-space: pre; overflow: hidden; counter-reset: ln; }
.src div { counter-increment: ln; padding-right: 10px; opacity: 0; transition: opacity .25s, background .6s; }
.src div::before { content: counter(ln); display: inline-block; width: 30px; padding-right: 10px; text-align: right; color: var(--muted2); }
.src div.on { opacity: 1; } .src div.hot { background: var(--line-hl); }
.k { color: var(--kw); } .s { color: var(--str); } .f { color: var(--fn); } .c { color: var(--com); font-style: italic; }

/* ---- a tool: the panel an agent builds from bricks (PanelChrome, stat / table / log bricks) ---- */

#tool.on { opacity: 1; transform: none; }
.phead { height: 29px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-bottom: 1px solid var(--line); font: 600 13px/1 var(--ui); color: var(--ink); }
.phead .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.phead span { margin-left: auto; display: flex; gap: 15px; color: var(--muted); }
.phead .keep { transition: color .3s, transform .4s var(--spring); }
.phead .keep.on { color: var(--accent); fill: currentColor; transform: scale(1.15); }
.pbody { padding: 8px; display: flex; flex-direction: column; gap: 9px; }
.pop { opacity: 0; transform: translateY(8px) scale(.97); transition: opacity .3s, transform .45s var(--spring); }
.pop.on { opacity: 1; transform: none; }
.tiles { display: flex; gap: 8px; }

.tile strong.ok { color: var(--ok); } .tile strong.warn { color: var(--warn); } .tile strong.err { color: var(--err); }
.card { border-radius: 6px; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 45%, var(--panel)); padding: 6px 8px 9px; }
.ct { display: flex; justify-content: space-between; align-items: baseline; height: 18px; font: 600 12px/1 var(--ui); color: var(--muted); }
.ct span { font: 400 10.5px/1 var(--ui); color: var(--muted2); }
.tr { display: grid; grid-template-columns: 111px 49px 119px 66px; height: 21px; align-items: center; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--text); white-space: nowrap; }
.tr.th { color: var(--muted); font-size: 12px; }
.tr .num { position: relative; text-align: right; padding-right: 2px; font-variant-numeric: tabular-nums; }
.tr .num::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: var(--bar, 0%); background: var(--sel); border-radius: 2px; transition: width .4s var(--ease); z-index: 0; }
.tr .num b { position: relative; font-weight: 400; }
.tr .good { color: var(--ok); } .tr .bad { color: var(--err); }

.tr.row.on { max-height: 21px; opacity: 1; border-bottom-width: 1px; }
.cell-flash { animation: cellflash .9s ease-out; }
@keyframes cellflash { 0% { background: color-mix(in srgb, var(--accent) 45%, transparent); } 100% { background: transparent; } }
.lines { height: 62px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; font: 400 11.5px/14.6px var(--mono); color: var(--text); white-space: pre; }

.lines em.warn { color: var(--warn); font-weight: 700; } .lines em.error { color: var(--err); font-weight: 700; }

.axis { display: flex; justify-content: space-between; margin-left: 170px; padding-bottom: 4px; border-bottom: 1px solid var(--line); font: 400 10.5px/1 var(--ui); color: var(--muted2); font-variant-numeric: tabular-nums; }
.lanes { position: relative; padding-top: 3px; }
.lane { display: flex; align-items: center; height: 20px; font-size: 12.5px; color: var(--text); }

.lane b { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--ok); transform: scaleX(0); transform-origin: 0 50%; transition: transform .5s var(--ease), background .4s; font: 500 10.5px/12px var(--ui); color: var(--accent-ink); padding-left: 5px; white-space: nowrap; overflow: hidden; }

    var pops = tool.querySelectorAll('.pop'), rows = tool.querySelectorAll('.tr.row'), bars = tool.querySelectorAll('.lane b'), acts = [];

    async function brick(name, cmd, target) {

  // direct manipulation: drag a node with the mouse; the IDE stays docked to its agent
  world.addEventListener('pointerdown', function (ev) {

  // The logo in the corner plays the opening now and then: lines come out of the transparent air around it,

    });

    host.innerHTML =
      '<radialGradient id="mg" gradientUnits="userSpaceOnUse" cx="500" cy="500" r="' + MARK.reach + '"><stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>' +
      '<mask id="mf" maskUnits="userSpaceOnUse" x="-3000" y="-3000" width="7000" height="7000"><rect x="-3000" y="-3000" width="7000" height="7000" fill="url(#mg)"/></mask>' +
      '<clipPath id="mo"><path clip-rule="evenodd" d="M-3000 -3000 H4000 V4000 H-3000 Z ' + sil + '"/></clipPath>' +
      '<mask id="mc"><path d="' + sil + '" fill="#fff"/><g fill="none" stroke="#000" stroke-width="' + G + '">' + [0, 90, 180, 270].map(function (a) { return rot('<path d="' + cut + '"/>', a); }).join('') + '</g></mask>' +
      '<mask id="mr" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">' + reveals + '<circle class="st" cx="500" cy="500" r="182" fill="#fff"/></mask>' +
      '<g mask="url(#mf)"><g clip-path="url(#mo)">' + lines + '</g></g>' +
      '<g mask="url(#mr)"><rect width="1000" height="1000" fill="currentColor" mask="url(#mc)"/></g>';
