# Ships a version of the app: push a tag (git tag -a v0.2.0 -m "what changed" && git push origin v0.2.0).
# The tagged commit must already have a passing `test` run, then native/scripts/release.sh builds, signs and
# notarizes Taksim-<version>.zip, creates the GitHub release that
# installed apps look for (Updater.swift) and updates the Homebrew cask in 0xhalil/homebrew-taksim.
# The same tag builds the Linux and Windows app (desktop/), runs each package, and adds it to that release.
# Run by hand ("Run workflow") it builds only and leaves the zip as a downloadable artifact, unless "publish" is ticked.
name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v, e.g. 0.2.0
        required: true
      notes:
        description: What changed (release notes)
        required: false
      publish:
        description: Publish the release (otherwise a dry run that only builds)
        type: boolean
        default: false
      desktop_only:
        description: Only the Linux and Windows app, added to the existing release of this version
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # waiting for the test run happens on a cheap Linux machine, not on the macOS one that builds
  tested:
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: The tests passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # the `test` workflow runs on every push to main; a tag pushed right behind it waits for it
          for i in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$SHA&per_page=20" \
              --jq '[.workflow_runs[] | .conclusion // "pending"] | join(" ")')
            case " $runs " in *" success "*) echo "tests passed on $SHA"; exit 0 ;; esac
            case " $runs " in *" pending "*) ;; *"  "*) [ "$i" -gt 6 ] && break ;; *) echo "tests did not pass on $SHA: $runs" >&2; exit 1 ;; esac
            sleep 30
          done
          echo "no passing test run for $SHA" >&2; exit 1

  release:
    needs: tested
    if: ${{ !cancelled() && !inputs.desktop_only && (needs.tested.result == 'success' || needs.tested.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          swift --version
      - name: Version and notes
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$EVENT" = push ]; then
            VERSION="${TAG#v}"; PUBLISH=true
            git fetch --force --tags origin "refs/tags/$TAG:refs/tags/$TAG" # checkout leaves the tag without its message
            NOTES=$(git tag -l --format='%(contents)' "$TAG")
          else
            VERSION="$INPUT_VERSION"; PUBLISH="$INPUT_PUBLISH"; NOTES="$INPUT_NOTES"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*) ;;
            *) echo "not a version: $VERSION" >&2; exit 1 ;;
          esac
          {
            echo "version=$VERSION"
            echo "publish=$PUBLISH"
            echo "notes<<TAKSIM_NOTES_END"; echo "$NOTES"; echo "TAKSIM_NOTES_END"
          } >> "$GITHUB_OUTPUT"
      - name: Import the Developer ID certificate
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          NOTARY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"; pw=$(uuidgen)
          security create-keychain -p "$pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pw" "$keychain"
          printf '%s' "$CERT_P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')
          [ -n "$identity" ] || { echo "no Developer ID Application certificate in the p12" >&2; exit 1; }
          printf '%s\n' "$NOTARY_P8" > "$RUNNER_TEMP/notary.p8"; chmod 600 "$RUNNER_TEMP/notary.p8"
          {
            echo "TAKSIM_SIGN_IDENTITY=$identity"
            echo "TAKSIM_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "TAKSIM_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "TAKSIM_NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
          NOTES: ${{ steps.v.outputs.notes }}
          PUBLISH: ${{ steps.v.outputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then
            printf '%s\n' "$TAP_KEY" > "$RUNNER_TEMP/tap_key"; chmod 600 "$RUNNER_TEMP/tap_key"
            TAKSIM_TAP_KEY="$RUNNER_TEMP/tap_key" native/scripts/release.sh "$VERSION" "$NOTES" --publish
          else
            native/scripts/release.sh "$VERSION" "$NOTES"
          fi
      - name: Keep the zip of a dry run
        if: steps.v.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Taksim-${{ steps.v.outputs.version }}
          path: native/build/release/*
          retention-days: 7

  # the Linux and Windows app, built on each system (node-pty is compiled for Linux there) and run before it ships
  desktop:
    needs: tested
    if: ${{ !cancelled() && (needs.tested.result == 'success' || needs.tested.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux, arch: x64, unpacked: linux-unpacked/taksim }
          - { os: ubuntu-24.04-arm, target: linux, arch: arm64, unpacked: linux-arm64-unpacked/taksim }
          # one installer for x64 and Arm: the Arm engine gets Node for Arm from nodejs.org, node-pty ships both
          - { os: windows-2022, target: win, arch: x64, unpacked: win-unpacked/taksim.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Version
        id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then VERSION="${TAG#v}"; else VERSION="$INPUT_VERSION"; fi
          case "$VERSION" in [0-9]*.[0-9]*) ;; *) echo "not a version: $VERSION" >&2; exit 1 ;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Stage the engine with its Node
        shell: bash
        run: |
          node desktop/scripts/stage-engine.mjs
          if [ "${{ matrix.target }}" = win ]; then node desktop/scripts/stage-engine.mjs --platform win32 --arch arm64; fi
      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          arch=""; [ "${{ matrix.target }}" = linux ] && arch="--${{ matrix.arch }}"
          npx electron-builder --config desktop/electron-builder.yml --${{ matrix.target }} $arch --publish never -c.extraMetadata.version="$VERSION"
      - name: The package starts its engine, chats, opens a terminal and stops on quit
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = linux ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run -a node desktop/test/package-smoke.mjs "dist/desktop/${{ matrix.unpacked }}"
          else
            node desktop/test/package-smoke.mjs "dist/desktop/${{ matrix.unpacked }}"
          fi
      - name: The .deb installs on a bare Debian and Ubuntu with everything the app loads
        if: matrix.target == 'linux'
        run: |
          for image in debian:bookworm-slim ubuntu:24.04; do
            docker run --rm -v "$PWD/dist/desktop":/d "$image" bash -c \
              'apt-get update -qq && apt-get install -y -qq /d/*.deb > /dev/null && ! ldd /opt/taksim/taksim | grep "not found"' \
              || { echo "the .deb is missing a dependency on $image" >&2; exit 1; }
          done
      - name: Checksums
        shell: bash
        run: |
          cd dist/desktop
          for f in *.exe *.AppImage *.deb; do [ -f "$f" ] || continue; node -e "const c=require('crypto'),fs=require('fs');process.stdout.write(c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex')+'\\n')" "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          retention-days: 7
          path: |
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/*.sha256
            dist/desktop/*.blockmap
            dist/desktop/latest*.yml

  # the Linux and Windows files join the release the macOS job created; latest*.yml is what installed apps update from
  desktop-publish:
    needs: [release, desktop]
    if: ${{ !cancelled() && (needs.release.result == 'success' || inputs.desktop_only) && needs.desktop.result == 'success' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then VERSION="${TAG#v}"; else VERSION="$INPUT_VERSION"; fi
          ls -la desktop
          gh release upload "v$VERSION" desktop/* --repo "$GITHUB_REPOSITORY" --clobber
