name: test

# A newer push cancels the previous run. Native checks stay on macOS; Linux runs the engine suite.
# Windows starts with platform/PTY checks until the remaining POSIX assumptions are removed.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bin/**"
      - "test/**"
      - "ui/**"
      - "toolbox/**"
      - "native/**"
      - "desktop/**"
      - "server.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "bin/**"
      - "test/**"
      - "ui/**"
      - "toolbox/**"
      - "native/**"
      - "desktop/**"
      - "server.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm test
      - name: Swift tests
        working-directory: native
        run: swift test

  linux-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests with a virtual display for Chrome
        run: xvfb-run -a npm test

  windows-platform:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Platform, web assets and real terminal smoke tests (not the full engine suite)
        run: node --test --test-timeout=60000 test/platform.test.mjs test/web-app.test.mjs

  # the engine suite on Windows (macOS-only tests skip themselves)
  windows-engine:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      # the tests' own repositories compare file text exactly; the runner's Git would write CRLF into them
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        # a file is done when its tests are: Windows' console host can outlive a test's terminal by a few seconds
        run: node --test --test-force-exit --test-timeout=120000 test/*.test.mjs

  # the Linux and Windows app as it ships: packaged with its own Node and engine, then run the way a person would
  desktop-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Stage the engine with its Node
        run: node desktop/scripts/stage-engine.mjs
      - name: Package
        shell: bash
        run: npx electron-builder --config desktop/electron-builder.yml --dir --publish never --x64 ${{ runner.os == 'Windows' && '--win' || '--linux' }}
      - name: The packaged app starts its engine, chats, opens a terminal and stops on quit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a node desktop/test/package-smoke.mjs dist/desktop/linux-unpacked/taksim
      - name: The packaged app starts its engine, chats, opens a terminal and stops on quit
        if: runner.os == 'Windows'
        run: node desktop/test/package-smoke.mjs dist/desktop/win-unpacked/taksim.exe
