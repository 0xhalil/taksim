name: test

# Actions minutes are short: tests run only when code changes, on one macOS machine, and a newer push to the same
# branch cancels the run still going.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bin/**"
      - "test/**"
      - "ui/**"
      - "toolbox/**"
      - "native/**"
      - "server.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "bin/**"
      - "test/**"
      - "ui/**"
      - "toolbox/**"
      - "native/**"
      - "server.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm test
      - name: Swift tests
        working-directory: native
        run: swift test
